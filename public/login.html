<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Sign in · MCP Monitor</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #1d2b26;
        --muted: #64736d;
        --line: #d7dfd8;
        --paper: #f3f6f1;
        --forest: #193b30;
        --mint: #c9e6a5;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background: var(--paper);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background-color: var(--paper);
        background-image: repeating-linear-gradient(0deg, transparent 0 39px, #dce5dc 40px),
          repeating-linear-gradient(90deg, transparent 0 39px, #dce5dc 40px);
        background-size: 40px 40px;
      }
      .card {
        width: min(100% - 2rem, 420px);
        padding: 36px 32px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fff;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
        font-size: 14px;
        font-weight: 700;
      }
      .mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 6px;
        color: var(--forest);
        background: var(--mint);
        font-family: ui-monospace, monospace;
        font-size: 13px;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        line-height: 1.2;
        font-weight: 650;
      }
      p {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
      }
      .google {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        width: 100%;
        margin-top: 28px;
        padding: 13px 18px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        background: var(--forest);
        font: inherit;
        font-weight: 600;
        text-decoration: none;
      }
      .google:hover { filter: brightness(1.08); }
      .google svg { flex: 0 0 auto; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand"><span class="mark">M</span><span>MCP MONITOR</span></div>
      <h1>Sign in to continue</h1>
      <p>Access is limited to allowlisted Google accounts.</p>
      <a class="google" href="/auth/google">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3 0 5.8 1.1 7.9 3l5.7-5.7C34 5.1 29.3 3 24 3 12.3 3 3 12.3 3 24s9.3 21 21 21 21-9.3 21-21c0-1.4-.1-2.7-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 13 24 13c3 0 5.8 1.1 7.9 3l5.7-5.7C34 5.1 29.3 3 24 3 16.1 3 9.2 7.4 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 45c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.3 36 26.8 37 24 37c-5.3 0-9.7-3.3-11.3-7.9l-6.5 5C9.1 40.5 16 45 24 45z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.5 5.5-6.5 6.6l.1.1 6.2 5.2C36.8 41.2 45 35 45 24c0-1.4-.1-2.7-.4-3.5z"/>
        </svg>
        Sign in with Google
      </a>
    </main>
  </body>
</html>
